[env:m5stick-c-plus2]
platform = espressif32@6.13.0
board = m5stick-c
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.2.21
    m5stack/M5GFX@^0.2.28
lib_extra_dirs =
    ../..
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
